name: Daily NBA FanDuel Bot

on:
  schedule:
    # Triggers at 22:17 UTC (4:17 PM CST) on an off-peak minute (:17)
    # Absorbs GitHub's 15-30 min queue lag so plays hit Discord around 4:30-4:45 PM CST
    - cron: '17 22 * * *'
  workflow_dispatch:

# Prevents duplicate runs from overlapping if a scheduled job is delayed
concurrency:
  group: nba-fanduel-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy requests pytz

      - name: Run NBA FanDuel Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python Bot.py
