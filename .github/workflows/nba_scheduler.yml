name: NBA EV Bot

on:
  schedule:
    # Main evening scan & live grading (4:45 PM CST = 22:45 UTC)
    - cron: '45 22 * * *'
    # Overnight West Coast grading & Daily Recap (1:30 AM CST = 07:30 UTC)
    - cron: '30 7 * * *'
    # Morning backup grading check (6:00 AM CST = 12:00 UTC)
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      grade_only:
        description: 'Run quick grading & recap only (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests numpy scipy pytz

      - name: Run NBA Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "30 7 * * *" ] || [ "${{ github.event.schedule }}" = "0 12 * * *" ] || [ "${{ github.event.inputs.grade_only }}" = "true" ]; then
            python Bot.py --grade-only
          else
            python Bot.py
          fi

      - name: Save Tracking State & Recap History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in tracked_all_markets.json daily_recaps_posted.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git diff --staged --quiet || git commit -m "chore: update tracked bets and recap state"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
