name: Daily NBA FanDuel Bot

on:
  schedule:
    # Runs automatically every day at 23:30 UTC (5:30 PM CST)
    # Stays active for 6 hours (until 11:30 PM CST) to scan pre-game lines and auto-grade finals
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub!

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas numpy scipy requests pytz

      - name: Run NBA FanDuel Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python Bot.py
