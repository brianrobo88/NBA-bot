name: NBA EV Bot

on:
  schedule:
    # Smart Matinee Check (10:17 AM CST = 16:17 UTC) — exits in 3s if no game <= 5:30 PM CST
    - cron: '17 16 * * *'
    # Main Evening Shift (4:17 PM CST = 22:17 UTC) — runs 5.5h with 90m pre-tip scan window
    - cron: '17 22 * * *'
    # Overnight West Coast grading & Daily Recap (1:23 AM CST = 07:23 UTC)
    - cron: '23 7 * * *'
    # Morning backup grading check (6:13 AM CST = 12:13 UTC)
    - cron: '13 12 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Shift mode to run manually'
        required: true
        default: 'evening'
        type: choice
        options:
          - evening
          - matinee
          - grade_only

permissions:
  contents: write

concurrency:
  group: nba-ev-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests numpy scipy pytz

      - name: Run NBA Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.schedule }}" = "23 7 * * *" ] || [ "${{ github.event.schedule }}" = "13 12 * * *" ] || [ "${{ github.event.inputs.mode }}" = "grade_only" ]; then
            python Bot.py --grade-only
          elif [ "${{ github.event.schedule }}" = "17 16 * * *" ] || [ "${{ github.event.inputs.mode }}" = "matinee" ]; then
            python Bot.py --matinee
          else
            python Bot.py
          fi

      - name: Save Tracking State & Recap History
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in tracked_all_markets.json daily_recaps_posted.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore: update tracked bets and recap state"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi
